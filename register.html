<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | IOIS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #123a3a, #071313 55%, #030707);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: rgba(10, 20, 20, .94);
            border: 1px solid rgba(212, 175, 55, .35);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 20px 70px rgba(0,0,0,.45);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 0;
            color: #d4af37;
            font-size: 34px;
        }

        .brand p {
            color: #b8c8c8;
            margin-top: 8px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #e8eeee;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #345050;
            background: #0d1b1b;
            color: #fff;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #d4af37;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 55px;
        }

        .toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #d4af37;
            cursor: pointer;
        }

        .terms {
            margin: 18px 0;
            display: flex;
            gap: 9px;
            align-items: flex-start;
            color: #aebbbb;
            font-size: 14px;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #d4af37, #f1d46a);
            color: #071313;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 13px;
            border-radius: 10px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: rgba(25, 135, 84, .18);
            border: 1px solid rgba(25, 135, 84, .45);
            color: #a8f0c8;
        }

        .message.error {
            display: block;
            background: rgba(220, 53, 69, .15);
            border: 1px solid rgba(220, 53, 69, .45);
            color: #ffb4bd;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #aebbbb;
        }

        .bottom a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #aebbbb;
            text-decoration: none;
        }

        .small {
            margin-top: 8px;
            font-size: 13px;
            color: #819292;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="brand">
        <h1>IOIS</h1>
        <p>
            Indian Online Income Supporting System
            <br>
            अपना digital account बनाइए
        </p>
    </div>

    <div id="message" class="message"></div>

    <form id="registerForm" novalidate>

        <label for="fullName">पूरा नाम</label>
        <input
            id="fullName"
            type="text"
            autocomplete="name"
            placeholder="अपना पूरा नाम"
            required
        >

        <label for="mobile">मोबाइल नंबर</label>
        <input
            id="mobile"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="10"
            placeholder="10 digit mobile number"
            required
        >

        <label for="email">Email</label>
        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required
        >

        <label for="password">Password</label>

        <div class="password-wrap">
            <input
                id="password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="कम से कम 8 characters"
                required
            >

            <button
                type="button"
                class="toggle"
                id="togglePassword"
            >
                👁
            </button>
        </div>

        <label for="confirmPassword">Password दोबारा लिखें</label>

        <div class="password-wrap">
            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Password confirm करें"
                required
            >

            <button
                type="button"
                class="toggle"
                id="toggleConfirmPassword"
            >
                👁
            </button>
        </div>

        <label class="terms">
            <input
                id="terms"
                type="checkbox"
                required
            >

            <span>
                मैं IOIS की registration information को सही मानता/मानती हूँ।
            </span>
        </label>

        <button id="registerButton" type="submit">
            Create IOIS Account
        </button>

    </form>

    <div class="bottom">
        पहले से account है?
        <a href="login.html">Login करें</a>
    </div>

    <a class="home" href="index.html">
        ← Home पर वापस जाएँ
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="register.js"></script>

</body>
</html>

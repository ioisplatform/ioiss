<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IOIS Account Recovery</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;background:radial-gradient(circle at top,#111c38 0,#030712 50%,#020617 100%);color:#fff}
.card{background:rgba(15,23,42,.88);border:1px solid rgba(245,158,11,.22);box-shadow:0 20px 70px rgba(0,0,0,.4)}
.input{width:100%;background:#020617;border:1px solid #334155;border-radius:12px;padding:13px;color:#fff;outline:none}
.input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.1)}
</style></head>
<body>
<main class="max-w-xl mx-auto px-4 py-10">
<div class="card rounded-3xl p-6 sm:p-8">
<a href="login.html" class="text-amber-400 text-sm">← Login</a>
<h1 class="text-2xl font-black mt-4">Account Recovery</h1>
<p class="text-gray-400 text-sm mt-2">Email verification link, OTP या WhatsApp OTP की जरूरत नहीं है।</p>

<div class="mt-6 flex gap-2">
<button id="idTab" class="flex-1 rounded-xl py-3 bg-amber-500 text-black font-bold">Forgot User ID</button>
<button id="pwTab" class="flex-1 rounded-xl py-3 bg-white/5 font-bold">Forgot Password</button>
</div>

<form id="idForm" class="mt-6 space-y-4">
<input id="idEmail" class="input" type="email" placeholder="Registered Email" required>
<input id="idPhone" class="input" inputmode="tel" placeholder="Registered WhatsApp / Mobile Number" required>
<button class="w-full rounded-xl py-3 bg-emerald-500 text-black font-black">Find My User ID</button>
</form>

<form id="pwForm" class="mt-6 space-y-4 hidden">
<input id="pwMember" class="input" placeholder="IOIS Member ID" required>
<input id="pwEmail" class="input" type="email" placeholder="Registered Email" required>
<input id="pwPhone" class="input" inputmode="tel" placeholder="Registered WhatsApp / Mobile Number" required>
<input id="newPw" class="input" type="password" minlength="8" placeholder="New Password (8+ characters)" required>
<input id="newPw2" class="input" type="password" minlength="8" placeholder="Confirm New Password" required>
<button class="w-full rounded-xl py-3 bg-amber-500 text-black font-black">Set New Password</button>
</form>
<div id="msg" class="hidden mt-5 rounded-xl border p-4 text-sm"></div>
</div></main>
<script src="config.js"></script>
<script>
const CFG=window.IOIS_CONFIG||{}; const msg=document.getElementById('msg');
function show(t,ok=false){msg.textContent=t;msg.className='mt-5 rounded-xl border p-4 text-sm '+(ok?'border-emerald-500/40 bg-emerald-950/30 text-emerald-200':'border-red-500/40 bg-red-950/30 text-red-200');}
const base=CFG.SUPABASE_URL||'https://hrvwzviprlnpkhrgzdrc.supabase.co';
const key=CFG.SUPABASE_PUBLISHABLE_KEY;
async function call(action,payload){
 const r=await fetch(base+'/functions/v1/iois-account-recovery',{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key},body:JSON.stringify({action,...payload})});
 const d=await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(d.message||'Recovery service unavailable.');
 return d;
}
idTab.onclick=()=>{idForm.classList.remove('hidden');pwForm.classList.add('hidden');idTab.className='flex-1 rounded-xl py-3 bg-amber-500 text-black font-bold';pwTab.className='flex-1 rounded-xl py-3 bg-white/5 font-bold'};
pwTab.onclick=()=>{pwForm.classList.remove('hidden');idForm.classList.add('hidden');pwTab.className='flex-1 rounded-xl py-3 bg-amber-500 text-black font-bold';idTab.className='flex-1 rounded-xl py-3 bg-white/5 font-bold'};
idForm.onsubmit=async e=>{e.preventDefault();try{const d=await call('find_user_id',{email:idEmail.value.trim().toLowerCase(),phone:idPhone.value.trim()});show('आपका IOIS Member ID: '+d.member_id,true)}catch(e){show(e.message)}};
pwForm.onsubmit=async e=>{e.preventDefault();if(newPw.value!==newPw2.value)return show('दोनों passwords समान होने चाहिए।');if(newPw.value.length<8)return show('Password कम से कम 8 characters का होना चाहिए।');try{await call('reset_password',{member_id:pwMember.value.trim().toUpperCase(),email:pwEmail.value.trim().toLowerCase(),phone:pwPhone.value.trim(),new_password:newPw.value});show('Password successfully update हो गया। अब Member ID से login करें।',true);pwForm.reset()}catch(e){show(e.message)}};
</script>
</body></html>
